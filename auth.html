<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Login or create your Rohan Milk Shop account."><title>Account | Rohan Milk Shop</title></head><body><div id="site-header"></div><main class="auth-wrap"><div class="auth-card"><div id="authContent"><span class="eyebrow">Customer account</span><h1 style="font-size:2.2rem">Welcome back</h1><p>Sign in to see your order history, or create an account for faster checkout.</p><div class="field"><label for="email">Email</label><input class="input" id="email" type="email" required autocomplete="email"></div><div class="field"><label for="password">Password</label><input class="input" id="password" type="password" required minlength="6" autocomplete="current-password"></div><div class="field hide" id="nameField"><label for="name">Name</label><input class="input" id="name" autocomplete="name"></div><div style="display:grid;gap:10px"><button class="btn btn-primary" id="submitAuth">Sign in</button><button class="btn btn-secondary" id="toggleAuth">Create account</button></div><p id="authMessage" class="meta" style="margin-top:14px"></p></div></div></main><div id="site-footer"></div><script type="module" src="js/auth.js"></script></body></html>
