<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Order received | Rohan Milk Shop</title></head><body><div id="site-header"></div><main class="container"><div class="success" id="success"><div class="circle"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 4 4L19 6"/></svg></div><h1>Order received</h1><p>Your pickup order has been sent to Rohan Milk Shop.</p><div id="orderDetails"></div><div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px"><a class="btn btn-primary" href="account.html">View my orders</a><a class="btn btn-secondary" href="shop.html">Continue shopping</a></div></div></main><div id="site-footer"></div><script type="module">import{renderHeader,renderFooter,money,esc}from './js/app.js';renderHeader();renderFooter();const o=JSON.parse(localStorage.getItem('rohan_last_order')||'null');document.querySelector('#orderDetails').innerHTML=o?`<div class="notice" style="text-align:left"><strong>Order #${esc(o.id.slice(-8).toUpperCase())}</strong><br>Total: ${money(o.total)}<br>Status: Pending<br><br>Please wait for the shop to confirm your order and mark it Ready for Pickup.</div>`:'<p>Your order details are not available on this device.</p>';</script></body></html>
